version: '3'

vars:
  WASM: target/wasm32-wasip2/release/stravia_vendor_qoder.wasm

tasks:
  default:
    deps: [dist]

  build:
    desc: 构建 wasm32-wasip2 release 组件
    cmds:
      - cargo build --locked --release --lib --target wasm32-wasip2 --target-dir target

  test:
    desc: 单元回归与组件契约验证（契约测试加载 release wasm，须先构建）
    deps: [build]
    cmds:
      - cargo test --locked --lib --target-dir target
      - cargo test --locked --test component_contract --target-dir target -- --ignored --nocapture

  verify:
    desc: 构建并执行全部验证
    deps: [test]
    cmds:
      - task: verify-egress-shape

  verify-egress-shape:
    desc: 离线对照两区域 CLI ClientHello（设置 STRAVIA_TOOLS 为配套宿主工具路径）
    deps: [build]
    requires:
      vars: [STRAVIA_TOOLS]
    cmds:
      - '"{{.STRAVIA_TOOLS}}" verify-egress-shape --component "{{.WASM}}" --shape plugin:qoder-cli --fixture tests/fixtures/qoder-cli.json --server-name gateway.qoder.com.cn'
      - '"{{.STRAVIA_TOOLS}}" verify-egress-shape --component "{{.WASM}}" --shape plugin:qoder-cli --fixture tests/fixtures/qoder-cli-global.json --server-name api2.qoder.sh'

  dist:
    desc: 构建并签名插件市场 v2 目录（配置见 README）
    deps: [build]
    cmds:
      - python3 scripts/dist.py
