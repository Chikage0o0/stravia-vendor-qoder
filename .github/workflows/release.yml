name: Release

# 打 v* tag 时构建 wasm32-wasip2 组件并发布 GitHub Release。
# tag 版本号必须与 Cargo.toml 的 package.version 一致，否则失败。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "待构建及发布的现有版本标签，例如 v0.1.8"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/stravia-vendor-qoder
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source/stravia-vendor-qoder

      - name: Checkout Stravia host SDK
        uses: actions/checkout@v4
        with:
          repository: Stravia-AI/StraviaPlatform
          ref: ${{ vars.STRAVIA_PLATFORM_REF || 'dbf1db1718fc4f45fca2aed0a03190505cae1892' }}
          path: source/worktrees/StraviaPlatform/merfolk

      # rust-toolchain.toml 是工具链版本的唯一来源
      - name: Read rust-toolchain.toml
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2
          workspaces: source/stravia-vendor-qoder -> target

      - name: Check tag matches Cargo.toml version
        run: |
          tag="${RELEASE_TAG#v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag version=$version"
          test "$tag" = "$version" || { echo "::error::tag $tag does not match Cargo.toml version $version"; exit 1; }

      - name: Build wasm component
        run: cargo build --locked --release --lib --target wasm32-wasip2

      - name: Verify unit and component contracts
        run: |
          cargo test --locked --lib
          cargo test --locked --test component_contract -- --ignored --nocapture

      - name: Package dist
        run: |
          name="stravia-vendor-qoder-v${RELEASE_TAG#v}.wasm"
          mkdir -p dist
          cp target/wasm32-wasip2/release/stravia_vendor_qoder.wasm "dist/$name"
          cp LICENSE NOTICE vendor/rust_decimal.LICENSE dist/
          (cd dist && sha256sum "$name" > SHA256SUMS && cat SHA256SUMS)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          # 保留人工发布且已真实验证的同名附件，不用 CI 重建产物覆盖它们。
          overwrite_files: false
          fail_on_unmatched_files: true
          files: source/stravia-vendor-qoder/dist/*
