name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "待发布的现有版本标签"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/stravia-vendor-qoder
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      HOST_VERSION_REQ: ${{ vars.HOST_VERSION_REQ }}
      REPOSITORY_ID: ${{ github.repository_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source/stravia-vendor-qoder

      - name: Require host range and resolve Platform tag
        id: platform
        run: |
          test -n "$HOST_VERSION_REQ" || { echo '::error::HOST_VERSION_REQ is required'; exit 1; }
          test "$REPOSITORY_ID" = 1403877632 || { echo '::error::Wrong repository'; exit 1; }
          # 目录工具与插件依赖必须来自同一个 Platform tag，Cargo.toml 是唯一来源
          tags=$(sed -n 's|.*git = "https://github.com/Stravia-AI/StraviaPlatform", tag = "\([^"]*\)".*|\1|p' Cargo.toml | sort -u)
          test -n "$tags" && test "$(printf '%s\n' "$tags" | wc -l)" = 1 || { echo '::error::Stravia dependencies must share exactly one tag'; exit 1; }
          echo "ref=$tags" >> "$GITHUB_OUTPUT"

      - name: Checkout catalog tool from the pinned Platform tag
        uses: actions/checkout@v4
        with:
          repository: Stravia-AI/StraviaPlatform
          ref: ${{ steps.platform.outputs.ref }}
          path: source/StraviaPlatform

      # rust-toolchain.toml 是工具链版本的唯一来源
      - name: Read rust-toolchain.toml
        id: toolchain
        run: echo "channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2
          workspaces: |
            source/stravia-vendor-qoder -> target
            source/StraviaPlatform -> target

      - name: Install catalog dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign cmake clang libclang-dev pkg-config libssl-dev

      - name: Build and verify component
        run: |
          cargo build --locked --release --lib --target wasm32-wasip2
          cargo test --locked --lib
          cargo test --locked --test component_contract -- --ignored --nocapture

      - name: Build shared catalog tool
        working-directory: source/StraviaPlatform
        run: |
          # Platform workspace 的 [patch.crates-io] 指向 target/patch，内建组件须先于 devtools 构建；
          # 步骤与其 Taskfile 的 prepare:crates / build:vendors 一致
          cargo install --locked --version 0.1.13 patch-crate
          cargo patch-crate --force
          cargo run --locked -p stravia-vendor-base --bin stravia-build-vendors
          cargo build --locked --release -p stravia-devtools --bin stravia-tools

      - name: Generate and sign distribution
        env:
          SIGNING_KEY: ${{ secrets.STRAVIA_PLUGIN_CATALOG_SIGNING_KEY }}
          PLUGIN_SIGNING_PASSWORD: ${{ secrets.STRAVIA_PLUGIN_CATALOG_SIGNING_PASSWORD }}
          PUBLIC_KEY: ${{ vars.STRAVIA_PLUGIN_CATALOG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" && test -n "$PLUGIN_SIGNING_PASSWORD" && test -n "$PUBLIC_KEY"
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$keydir/key"
          printf '%s\n' "$PUBLIC_KEY" > "$keydir/pub"
          export PLUGIN_SIGNING_KEY_FILE="$keydir/key" PLUGIN_PUBLIC_KEY_FILE="$keydir/pub"
          export STRAVIA_TOOLS="$GITHUB_WORKSPACE/source/StraviaPlatform/target/release/stravia-tools"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export PUBLISHED_AT
          python3 scripts/dist.py

      - name: Create draft with exact assets
        run: |
          set -euo pipefail
          asset="dist/stravia-vendor-qoder-${RELEASE_TAG}.wasm.zst"
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
            "$asset" dist/stravia-plugin-catalog.json \
            dist/stravia-plugin-catalog.json.minisig dist/stravia-plugin-catalog.pub \
            dist/LICENSE dist/NOTICE dist/rust_decimal.LICENSE

      - name: Verify uploaded draft and publish
        run: |
          python3 scripts/verify_release.py
          gh release edit "$RELEASE_TAG" --draft=false
