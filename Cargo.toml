[package]
name = "stravia-vendor-qoder"
version = "0.1.10"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
authors = ["Chikage0o0 <chikage@939.me>"]
description = "Qoder China and global native HTTP vendor component for Stravia"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stravia-vendor-sdk = { path = "../worktrees/StraviaPlatform/merfolk/backend/crates/stravia-vendor-sdk" }
stravia-vendor-common = { path = "../worktrees/StraviaPlatform/merfolk/backend/crates/stravia-vendor-common" }
stravia-runtime-contract = { path = "../worktrees/StraviaPlatform/merfolk/backend/crates/stravia-runtime-contract" }
stravia-protocol-codec = { path = "../worktrees/StraviaPlatform/merfolk/backend/crates/stravia-protocol-codec" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
semver = { version = "1", features = ["serde"] }
base64 = "0.23"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
rsa = { version = "0.9", default-features = false, features = ["pem", "u64_digit", "hazmat"] }
getrandom = "0.3"
md-5 = "0.10"
sha2 = "0.10"
zeroize = { version = "1", features = ["alloc"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
stravia-vendor-runtime = { path = "../worktrees/StraviaPlatform/merfolk/backend/crates/stravia-vendor-runtime" }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
parking_lot = "0.12"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"

[package.metadata.component]
package = "stravia:vendor"
